<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>市场情绪 - 5日趋势</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
  --border: #30363d; --text: #e6edf3; --text2: #8b949e;
  --up: #ff6b6b; --down: #26de81; --gold: #f7b731;
  --blue: #4ecdc4; --purple: #a29bfe; --orange: #fd9644;
  --cyan: #45aaf2;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
.header {
  background: linear-gradient(135deg,#1a1f2e,#161b22 50%,#0d1117);
  border-bottom:1px solid var(--border); padding:20px 24px;
  display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:12px;
}
.header h1 { font-size:20px; }
.header h1 span { color:var(--gold); }
.hdr-right { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--text2); }
.btn {
  padding:6px 14px; border-radius:6px; border:1px solid var(--border);
  background:var(--bg3); color:var(--text); cursor:pointer; font-size:12px;
  text-decoration:none; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover { border-color:var(--gold); color:var(--gold); }
.container { max-width:1200px; margin:0 auto; padding:20px; }

.charts-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:16px;
}
@media(max-width:1000px) { .charts-grid { grid-template-columns:1fr; } }

.card {
  background:var(--bg2); border:1px solid var(--border); border-radius:12px;
  overflow:hidden;
}
.card-head {
  padding:14px 18px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.card-head h3 { font-size:14px; }
.card-head .sub { font-size:11px; color:var(--text2); }
.card-body { padding:12px 8px; min-height:260px; position:relative; }
.card-body canvas { width:100% !important; height:260px !important; }
#sectorOutCanvas { height:185px !important; }  /* 流出Top5：5条，比流入Top10矮 */
.card-err { display:flex; align-items:center; justify-content:center; height:260px; color:var(--down); font-size:13px; flex-direction:column; gap:8px; }

.card-anno {
  border-top:1px solid var(--border); padding:10px 14px;
  font-size:11px; line-height:1.6; color:var(--text2);
}
.card-anno .anno-icon { color:var(--cyan); margin-right:4px; }
.card-anno .anno-bull { color:var(--up); }
.card-anno .anno-bear { color:var(--down); }
.card-anno .anno-warn { color:var(--gold); }

.loading { text-align:center; padding:80px 0; color:var(--text2); }
.spinner {
  width:36px; height:36px; border:3px solid var(--border);
  border-top-color:var(--gold); border-radius:50%;
  animation:spin 0.8s linear infinite; margin:0 auto 12px;
}
@keyframes spin { to{transform:rotate(360deg)} }
.err-msg { text-align:center; padding:60px 0; color:var(--down); }

.status-bar {
  display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px;
}
.st-chip {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:8px; padding:8px 14px; font-size:12px;
  display:flex; align-items:center; gap:8px;
}
.st-chip .dot {
  width:8px; height:8px; border-radius:50%;
}
.st-chip.ok .dot { background:var(--up); box-shadow:0 0 4px var(--up); }
.st-chip.err .dot { background:var(--down); }


/* ── 板块资金净流入（独立展示区） ── */
.sector-flow-section { margin-top: 24px; }
.sector-flow-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden;
}
.sector-flow-head {
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 8px;
}
.sf-title { font-size: 15px; font-weight: 700; }
.sf-sub { font-size: 11px; color: var(--text2); }
.sf-stale {
  font-size: 11px; color: #f0a020; background: rgba(240,160,32,0.12);
  padding: 2px 8px; border-radius: 4px; font-weight: 600;
}
.sector-flow-body { padding: 16px 20px; }
.sector-flow-body canvas { width: 100% !important; height: 220px !important; }

/* ── 情绪综合研判卡片 ── */

.judge-section { margin-top: 24px; }
.judge-card {
  background: linear-gradient(135deg, #1a1f2e 0%, #161b22 50%, #0d1117 100%);
  border: 2px solid var(--border); border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 32px rgba(0,0,0,0.3);
}
.judge-head {
  background: linear-gradient(135deg, rgba(162,155,254,0.12), rgba(69,170,242,0.08));
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex; align-items: center; gap: 10px;
}
.judge-icon { font-size: 24px; }
.judge-title { font-size: 16px; font-weight: 700; color: var(--purple); letter-spacing: 0.5px; }
.judge-badge {
  margin-left: auto;
  padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;
}
.judge-badge.extreme_bullish, .judge-badge.bullish { background: rgba(38,222,129,0.15); color: var(--up); border: 1px solid var(--up); }
.judge-badge.slightly_bullish { background: rgba(247,183,49,0.15); color: var(--gold); border: 1px solid var(--gold); }
.judge-badge.neutral { background: rgba(139,148,158,0.15); color: var(--text2); border: 1px solid var(--text2); }
.judge-badge.slightly_bearish { background: rgba(253,150,68,0.15); color: var(--orange); border: 1px solid var(--orange); }
.judge-badge.bearish, .judge-badge.extreme_bearish { background: rgba(255,107,107,0.15); color: var(--up); border: 1px solid var(--up); }

.judge-body { padding: 20px 24px; }
.judge-main { display: flex; align-items: center; gap: 24px; margin-bottom: 20px; flex-wrap: wrap; }
.judge-score-circle {
  width: 90px; height: 90px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  flex-shrink: 0;
  border: 4px solid var(--border);
  background: var(--bg3);
}
.judge-score-num { font-size: 32px; font-weight: 900; line-height: 1; color: var(--text); }
.judge-score-max { font-size: 11px; color: var(--text2); margin-top: 2px; }
.judge-verdict { flex: 1; font-size: 14px; line-height: 1.7; color: var(--text); min-width: 200px; }

.judge-details {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 8px;
}
.judge-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px; border-radius: 8px;
  background: var(--bg3); font-size: 12px; gap: 8px;
}
.judge-item-label { color: var(--text2); white-space: nowrap; }
.judge-item-value { font-weight: 600; white-space: nowrap; }
.judge-item-bar {
  flex: 1; height: 4px; border-radius: 2px; background: var(--border);
  overflow: hidden; min-width: 40px;
}
.judge-item-bar-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; }

/* ── AI 预测卡片 ── */
.predict-section { margin-top: 28px; }
.predict-card {
  background: linear-gradient(135deg, #1a1f2e 0%, #161b22 50%, #0d1117 100%);
  border: 2px solid var(--border); border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 32px rgba(0,0,0,0.3);
}
.predict-head {
  background: linear-gradient(135deg, rgba(247,183,49,0.12), rgba(78,205,196,0.08));
  border-bottom: 1px solid var(--border);
  padding: 18px 24px;
  display: flex; align-items: center; gap: 14px;
  flex-wrap: wrap;
}
.predict-head-icon {
  font-size: 32px; flex-shrink: 0;
  animation: predictPulse 2s ease-in-out infinite;
}
@keyframes predictPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}
.predict-head-info { flex: 1; }
.predict-head-title {
  font-size: 18px; font-weight: 700; color: var(--gold);
  letter-spacing: 0.5px;
}
.predict-head-meta {
  font-size: 11px; color: var(--text2); margin-top: 2px;
}
.direction-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
}
.direction-badge.bullish { background: rgba(38,222,129,0.12); color: var(--up); }
.direction-badge.bearish { background: rgba(255,107,107,0.12); color: var(--down); }
.direction-badge.neutral { background: rgba(247,183,49,0.12); color: var(--gold); }

.predict-body {
  padding: 20px 24px;
  line-height: 1.8; font-size: 14px; color: var(--text);
  white-space: pre-wrap; word-break: break-word;
}
.predict-loading { text-align: center; padding: 40px; color: var(--text2); }

/* ── 反馈区 ── */
.feedback-section {
  border-top: 1px solid var(--border);
  padding: 18px 24px;
  background: rgba(0,0,0,0.15);
}
.feedback-title {
  font-size: 13px; color: var(--text2); margin-bottom: 12px;
  display: flex; align-items: center; gap: 6px;
}
.feedback-btns {
  display: flex; gap: 12px; margin-bottom: 12px;
}
.fb-btn {
  padding: 10px 24px; border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--bg2); color: var(--text); cursor: pointer;
  font-size: 14px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
  transition: all 0.2s;
}
.fb-btn:hover { transform: translateY(-1px); }
.fb-btn.agree { border-color: rgba(38,222,129,0.4); }
.fb-btn.agree:hover { background: rgba(38,222,129,0.1); border-color: var(--up); color: var(--up); }
.fb-btn.agree.selected { background: rgba(38,222,129,0.2); border-color: var(--up); color: var(--up); }
.fb-btn.disagree { border-color: rgba(255,107,107,0.4); }
.fb-btn.disagree:hover { background: rgba(255,107,107,0.1); border-color: var(--down); color: var(--down); }
.fb-btn.disagree.selected { background: rgba(255,107,107,0.2); border-color: var(--down); color: var(--down); }

.feedback-comment {
  width: 100%; min-height: 72px; padding: 12px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 13px; font-family: inherit;
  resize: vertical; outline: none; margin-bottom: 12px;
}
.feedback-comment:focus { border-color: var(--gold); }
.feedback-comment::placeholder { color: var(--text2); }

.fb-submit {
  padding: 10px 32px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, var(--gold), #e5a61e);
  color: #0d1117; cursor: pointer; font-size: 14px; font-weight: 700;
  transition: all 0.2s;
}
.fb-submit:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(247,183,49,0.3); }
.fb-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

.fb-result { font-size: 12px; margin-top: 8px; }
.fb-result.ok { color: var(--up); }
.fb-result.err { color: var(--down); }

/* ── 我的反馈历史（时间线） ── */
.my-feedback-section {
  margin-top: 20px; border-top: 1px solid var(--border);
  padding: 18px 24px;
}
.my-fb-title {
  font-size: 14px; font-weight: 700; margin-bottom: 10px;
}
.my-fb-item {
  background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px; margin-bottom: 8px;
}
.my-fb-item-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.my-fb-dir { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.my-fb-dir.bullish { background: rgba(255,107,107,0.15); color: var(--up); }
.my-fb-dir.bearish { background: rgba(38,222,129,0.15); color: var(--down); }
.my-fb-dir.neutral { background: rgba(139,148,158,0.15); color: var(--text2); }
.my-fb-agree { font-size: 11px; padding: 2px 8px; border-radius: 4px; }
.my-fb-agree.yes { background: rgba(38,222,129,0.15); color: var(--down); }
.my-fb-agree.no { background: rgba(255,107,107,0.15); color: var(--up); }
.my-fb-pred { font-size: 12px; line-height: 1.6; color: var(--text); cursor: pointer; }
.my-fb-comment {
  margin-top: 8px; padding: 8px 12px; background: rgba(250,237,218,0.15);
  border-left: 3px solid var(--gold); border-radius: 0 6px 6px 0;
  font-size: 12px; color: var(--text2); line-height: 1.5;
}
.my-fb-empty { color: var(--text2); font-size: 12px; padding: 12px; background:rgba(0,0,0,0.15); border-radius:8px; text-align:center; }

/* 时间线容器 */
.fb-timeline { display:flex; flex-direction:column; gap:0; }
.fb-date-group { margin-bottom:16px; }
.fb-date-header {
  font-size:11px; font-weight:700; color:var(--accent); margin-bottom:8px;
  padding:3px 0; border-bottom:1px solid rgba(139,148,158,0.15);
  display:flex; align-items:center; gap:6px;
}
.fb-date-header .fb-date-badge {
  font-size:9px; padding:1px 5px; border-radius:4px; background:rgba(139,148,158,0.15); color:var(--text2); font-weight:600;
}
.fb-date-header.is-today { color:#f7b731; }
.fb-date-header.is-today .fb-date-badge { background:rgba(247,183,49,0.15); color:#f7b731; }

/* 每条反馈项 */
.fb-item {
  background: rgba(0,0,0,0.2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px; margin-bottom:6px;
  font-size:12px; line-height:1.55; cursor:default;
  transition: border-color 0.15s;
}
.fb-item:hover { border-color: rgba(139,148,158,0.35); }
.fb-item.is-current { border-color: rgba(247,183,49,0.4); background:rgba(247,183,49,0.04); }
.fb-item-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.fb-dir-badge { font-weight:600; font-size:11px; padding:1px 6px; border-radius:4px; }
.fb-dir-badge.bullish { background:rgba(255,107,107,0.12); color:#ff6b6b; }
.fb-dir-badge.bearish { background:rgba(38,222,129,0.10); color:#26de81; }
.fb-dir-badge.neutral { background:rgba(78,205,196,0.12); color:#4ecdc4; }
.fb-agree-tag { font-weight:600; font-size:11px; }
.fb-agree-tag.yes { color:#ff6b6b; }
.fb-agree-tag.no { color:#26de81; }
.fb-predict-text { color: var(--text2); margin-top:4px; font-size:11.5px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height:1.5;
}
.fb-predict-text:hover { -webkit-line-clamp: unset; cursor:pointer; }
.fb-meta-row { font-size:10px; color:var(--text-tertiary); margin-top:5px; display:flex; gap:10px; flex-wrap:wrap; }
.fb-comment-text { font-size:11px; color:var(--gold); margin-top:5px; padding:5px 8px; background:rgba(247,183,49,0.06); border-radius:4px; border-left:2px solid var(--gold); }
.fb-action-btn {
  font-size:10px; padding:2px 8px; border-radius:4px; border:1px solid rgba(139,148,158,0.25);
  background:transparent; color:var(--text2); cursor:pointer; margin-top:5px;
  transition:all 0.15s;
}
.fb-action-btn:hover { border-color:var(--accent); color:var(--accent); background:rgba(139,148,158,0.08); }
</style>
</head>
<body>

<div class="header">
  <div><h1>📊 <span>情绪</span> · 5日趋势仪表盘</h1></div>
  <div class="hdr-right">
    <span id="ts">加载中...</span>
    <span id="td" style="color:var(--accent);font-weight:600;margin-left:12px;"></span>
    <button class="btn" onclick="location.reload()">🔄 刷新</button>
  </div>
</div>

<div class="container">
  <div class="charts-grid" id="grid">
    <div class="loading" id="loadingEl">
      <div class="spinner"></div>
      <div>获取5日趋势数据...</div>
      <div style="font-size:11px">ifzq + push2delay</div>
    </div>
    <div class="err-msg" id="errEl" style="display:none">
      <div style="font-size:28px">⚠️</div>
      <div id="errTxt"></div>
      <button class="btn" onclick="location.reload()" style="margin-top:10px">重试</button>
    </div>
  </div>
</div>

<!-- 板块资金净流入（独立展示） -->
<div class="container sector-flow-section" id="sectorFlowSection" style="display:none">
  <div class="sector-flow-card">
    <div class="sector-flow-head">
      <span class="sf-title">🏭 板块资金 · 净流入</span>
      <span class="sf-stale" id="sectorFlowStale" style="display:none"></span>
      <span class="sf-sub" id="sectorFlowSub"></span>
    </div>
    <div class="sector-flow-body" id="sectorFlowBody">
      <div class="loading"><div class="spinner"></div><div>加载板块资金数据...</div></div>
    </div>
    <div class="card-anno" id="sectorFlowAnno" style="display:none"></div>
  </div>
</div>

<!-- 情绪综合研判（规则引擎） -->
<div class="container judge-section" id="judgeSection" style="display:none">
  <div class="judge-card">
    <div class="judge-head">
      <span class="judge-icon">🧠</span>
      <span class="judge-title">情绪综合研判</span>
      <span class="judge-badge" id="judgeBadge"></span>
    </div>
    <div class="judge-body">
      <div class="judge-main">
        <div class="judge-score-circle" id="judgeCircle">
          <span class="judge-score-num" id="judgeScoreNum">--</span>
          <span class="judge-score-max">/10</span>
        </div>
        <div class="judge-verdict" id="judgeVerdict"></div>
      </div>
      <div class="judge-details" id="judgeDetails"></div>
    </div>
  </div>
</div>

<!-- AI预测 + 用户反馈 -->
<div class="container predict-section" id="predictSection" style="display:none">
  <div class="predict-card">
    <div class="predict-head">
      <span class="predict-head-icon">🤖</span>
      <div class="predict-head-info">
        <div class="predict-head-title" id="predictTitle">AI 市场走势预测</div>
        <div class="predict-head-meta" id="predictMeta"></div>
      </div>
      <span class="direction-badge" id="directionBadge" style="display:none"></span>
    </div>
    <div class="predict-body" id="predictBody">
      <div class="predict-loading"><div class="spinner"></div><div style="margin-top:8px">AI 正在分析近5日走势数据...</div></div>
    </div>
    <div class="feedback-section" id="feedbackSection" style="display:none">
      <div class="feedback-title">💬 这个预测准确吗？你的反馈将帮助AI持续优化</div>
      <div class="feedback-btns">
        <button class="fb-btn agree" id="btnAgree" onclick="selectFeedback(true)">👍 认可</button>
        <button class="fb-btn disagree" id="btnDisagree" onclick="selectFeedback(false)">👎 不认可</button>
      </div>
      <textarea class="feedback-comment" id="fbComment" placeholder="说说你的看法（选填，例如：预测理由不充分 / 忽略了某个因素...）"></textarea>
      <button class="fb-submit" id="btnSubmit" onclick="submitFeedback()" disabled>提交反馈</button>
      <div class="fb-result" id="fbResult"></div>
    </div>
    <div class="my-feedback-section" id="myFeedbackSection" style="display:none">
      <div class="my-fb-title">📋 我的反馈</div>
      <div id="myFeedbackList"></div>
    </div>
  </div>
</div>

<script>
const C = {
  up:'#ff6b6b', down:'#26de81', gold:'#f7b731',
  blue:'#4ecdc4', purple:'#a29bfe', orange:'#fd9644',
  text:'#8b949e', grid:'rgba(139,148,158,0.12)',
};
let charts = [];

function sdate(d) { return d ? d.slice(5) : ''; }

async function init() {
  _userId = getOrCreateUserId();
  try {
    const r = await fetch('/api/sentiment/v2');
    const d = await r.json();
    document.getElementById('loadingEl').style.display = 'none';
    if (d.error) throw new Error(d.error);
    document.getElementById('ts').textContent = d.timestamp || '-';
    var tdEl = document.getElementById('td');
    if (d.trade_date) {
      tdEl.textContent = '📅 数据日期: ' + d.trade_date;
      tdEl.title = '数据对应的交易日（非系统时间）';
    }
    // 非交易日提示（周末/节假日）
    if (d.trading_day === false) {
      var hdrRight = document.querySelector('.hdr-right');
      if (hdrRight && !document.getElementById('ntWarn')) {
        var w = document.createElement('span');
        w.id = 'ntWarn';
        w.style.cssText = 'font-size:11px;color:#f7b731;background:rgba(247,183,49,0.12);padding:2px 8px;border-radius:4px;';
        w.textContent = '⚠️ 非交易日';
        hdrRight.appendChild(w);
      }
    }
    renderVol(d.modules.sh_volume);
    renderMarketVolume(d.modules.sh_volume);
    renderVolDev(d.modules.volume_dev);

function renderVol(mod) {
  var anno = '<span class="anno-icon">💡</span> 沪深两市近5交易日K线图（OHLC），红柱为阳线（收盘≥开盘）、绿柱为阴线（收盘＜开盘）。'
    + '<br><span class="anno-bull">阳线</span> = 多头占优，买方力量强；'
    + '<span class="anno-bear">阴线</span> = 空头占优，抛压较重。'
    + '<br>上影线长 = 冲高回落；下影线长 = 探底回升。';
  var card = mkCard('M1','📈 上证指数近5日K线','OHLC', anno, (mod||{}).source||'');
  if (!mod.success || !mod.data || !mod.data.length) {
    renderCardError(card, mod, '数据获取失败');
    document.getElementById('grid').appendChild(card);
    return;
  }
  var container = card.querySelector('.card-body');
  container.innerHTML = '';
  var canvas = document.createElement('canvas');
  canvas.style.width = '100%';
  canvas.style.height = '260px';
  container.appendChild(canvas);

  // ★ 先挂到 grid 让浏览器布局，否则 canvas.offsetWidth = 0
  document.getElementById('grid').appendChild(card);

  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  var w = rect.width, h = 260;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  var data = mod.data;
  // 计算价格区间
  var allHigh = data.map(function(d){return d.high;});
  var allLow  = data.map(function(d){return d.low;});
  var maxP = Math.max.apply(null, allHigh);
  var minP = Math.min.apply(null, allLow);
  var pad = (maxP - minP) * 0.12 || maxP * 0.01;
  maxP += pad; minP -= pad;
  var range = maxP - minP || 1;

  var margin = {top:20, right:55, bottom:30, left:10};
  var plotW = w - margin.left - margin.right;
  var plotH = h - margin.top - margin.bottom;
  var n = data.length;
  var barW = Math.max(4, (plotW / n) * 0.6);
  var gap  = plotW / n;

  function yOf(price) { return margin.top + plotH - (price - minP) / range * plotH; }
  function drawPriceAxis() {
    ctx.strokeStyle = C.text; ctx.lineWidth = 0.5; ctx.font = '10px sans-serif'; ctx.fillStyle = C.text;
    var steps = 5;
    for (var i = 0; i <= steps; i++) {
      var p = minP + range * i / steps;
      var y = yOf(p);
      ctx.beginPath(); ctx.moveTo(w - margin.right, y); ctx.lineTo(w - margin.right + 4, y); ctx.stroke();
      ctx.fillText(p.toFixed(2), w - margin.right + 6, y + 3);
    }
  }
  function drawDateAxis() {
    ctx.fillStyle = C.text; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    data.forEach(function(d, i) {
      var x = margin.left + gap * i + gap / 2;
      ctx.fillText(sdate(d.date), x, h - 6);
    });
  }

  // 背景网格
  ctx.strokeStyle = C.grid; ctx.lineWidth = 0.5;
  for (var i = 0; i <= 5; i++) {
    var y = margin.top + plotH * i / 5;
    ctx.beginPath(); ctx.moveTo(margin.left, y); ctx.lineTo(w - margin.right, y); ctx.stroke();
  }

  // 绘制K线
  data.forEach(function(d, i) {
    var x     = margin.left + gap * i + gap / 2;
    var open  = d.open, close = d.close, high = d.high, low = d.low;
    var isUp  = close >= open;
    var color = isUp ? C.up : C.down;

    // 上下影线
    ctx.strokeStyle = color; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, yOf(high));
    ctx.lineTo(x, yOf(low));
    ctx.stroke();

    // 实体
    var bodyTop    = yOf(Math.max(open, close));
    var bodyBottom = yOf(Math.min(open, close));
    var bodyH      = Math.max(1, bodyBottom - bodyTop);
    ctx.fillStyle = color;
    // 阳线空心，阴线实心（A股风格）
    if (isUp) {
      ctx.strokeStyle = color; ctx.lineWidth = 1;
      ctx.strokeRect(x - barW/2, bodyTop, barW, bodyH);
    } else {
      ctx.fillRect(x - barW/2, bodyTop, barW, bodyH);
    }
  });

  drawPriceAxis();
  drawDateAxis();

  // 子类标注最新价格
  var last = data[data.length - 1];
  var lastColor = last.close >= last.open ? C.up : C.down;
  var subEl = card.querySelector('.sub');
  subEl.innerHTML = '最新 <b style="color:' + lastColor + '">' + last.close.toFixed(2) + '</b>';
}

  var bgColors = data.map(function(d, i){
    var priceUp = d.close >= d.open;
    var volUp = i === 0 ? false : d.amount_yi > data[i-1].amount_yi;
    if (priceUp) {
      return volUp ? 'rgba(255,107,107,0.65)' : 'rgba(255,107,107,0.25)';  // 放量涨深红 / 缩量涨浅红

    }
  });
  var bdColors = data.map(function(d, i){
    var priceUp = d.close >= d.open;
    var volUp = i === 0 ? false : d.amount_yi > data[i-1].amount_yi;
    if (priceUp) {
      return volUp ? '#ff6b6b' : '#f4a4a4';
    } else {
      return volUp ? '#26de81' : '#80d4a8';
    }
  });
  // 预计算涨跌+量能标签给 tooltip
  var volLabels = data.map(function(d, i){
    var priceUp = d.close >= d.open;
    var volUp = i === 0 ? false : d.amount_yi > data[i-1].amount_yi;
    var priceTag = priceUp ? '📈上涨' : '📉下跌';

  var c = new Chart(ctx, {
    type:'bar',
    data:{
      labels: dates,
      datasets:[{
        label:'成交额 (亿元)', data:amounts,
        backgroundColor: bgColors, borderColor: bdColors,
        borderWidth:1, borderRadius:4,
      }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'rgba(22,27,34,0.95)', titleColor:C.text, bodyColor:C.text,
          borderColor:C.border, borderWidth:1,
          callbacks:{ label: function(ctx){
              var idx = ctx.dataIndex;
              var label = (idx >= 0 && idx < volLabels.length) ? volLabels[idx] : '';
              return amt2str(ctx.raw) + '  ' + label;
            } }
        }
      },
      scales:{
        x:{ ticks:{ color:C.text, font:{size:9} }, grid:{ color:C.grid } },
        y:{
          title:{ display:true, text:'亿元', color:C.text },
          ticks:{ color:C.text, callback:function(v){ return amt2str(v); } },
          grid:{ color:C.grid },
        },
      },
    },
  });
  charts.push(c);

  var last = data[data.length - 1];
  var prev = data.length >= 2 ? data[data.length - 2] : null;
  var lastColor = last.close >= last.open ? 'var(--up)' : 'var(--down)';
  var volDir = prev ? (last.amount_yi > prev.amount_yi ? '📈放量' : '📉缩量') : '';
  var subEl = card.querySelector('.sub');
  subEl.innerHTML = '最新 <b style="color:' + lastColor + '">' + amt2str(last.amount_yi) + '</b> ' + volDir;
}

// ── M8: 板块资金净流入（独立全宽卡片，位于综合研判前）──

  subEl.innerHTML = '流入Top10 <b style="color:' + tColor + '">' + (total >= 0 ? '+' : '') + total.toFixed(1) + '亿</b>'

    +   '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:6px;font-weight:600;">🔴 主力流入 Top10</div>'
    +   '<div style="position:relative;"><canvas id="sectorCanvas"></canvas></div>'
    + '</div>'
    + (outSectors.length
      ? '<div style="flex:2;min-width:0;">'
        +   '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:6px;font-weight:600;">🟢 主力流出 Top5</div>'
        +   '<div style="position:relative;"><canvas id="sectorOutCanvas"></canvas></div>'
        + '</div>'
      : '')
    + '</div>';

  // --- 流入 Top10 柱状图 ---

  var flows = sectors.map(function(s){ return s.main_net_yi; });
  var bgColors = flows.map(function(v){ return v >= 0 ? 'rgba(255,107,107,0.45)' : 'rgba(38,222,129,0.35)'; });
  var bdColors = flows.map(function(v){ return v >= 0 ? '#ff6b6b' : '#26de81'; });

  var ctx = document.getElementById('sectorCanvas').getContext('2d');
  var c = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: names,
      datasets: [{ label: '主力净流入(亿)', data: flows, backgroundColor: bgColors, borderColor: bdColors, borderWidth: 1, borderRadius: 3 }]

      responsive: true, maintainAspectRatio: false,

      scales: {
        x: { ticks: { color: C.text, font: { size: 11 }, callback: function(v){ return (v>=0?'+':'')+v+'亿'; } }, grid: { color: C.grid } },
        y: { ticks: { color: C.text, font: { size: 11 } }, grid: { color: C.grid } },
      },

  // --- 流出 Top5 柱状图 ---

    var outFlows = outSectors.map(function(s){ return s.main_net_yi; });

        scales: {
          x: { ticks: { color: C.text, font: { size: 11 }, callback: function(v){ return v+'亿'; } }, grid: { color: C.grid } },
          y: { ticks: { color: C.text, font: { size: 11 } }, grid: { color: C.grid } },
        },
      },
    });
    charts.push(c2);
  }

  // ===== 下半区：5日趋势对比 =====
  if (hist.length >= 2) {
    var maxVal = 1;
    hist.forEach(function(h){ maxVal = Math.max(maxVal, Math.abs(h.total_net_yi)); });

    var trendHtml = '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">';
    trendHtml += '<div style="display:flex;gap:20px;align-items:flex-start;">';

    // --- 左侧：5日柱状图 ---
    trendHtml += '<div style="flex:1;min-width:0;">';
    trendHtml += '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:8px;font-weight:600;">近5日 Top10 合计资金流（亿元）</div>';
    trendHtml += '<div style="display:flex;align-items:flex-end;gap:6px;height:80px;padding:0 4px;">';
    hist.forEach(function(h, i){
        var val = h.total_net_yi;
        var absVal = Math.abs(val);
        var barH = Math.max(Math.round(absVal / maxVal * 70), 3);
        var isLast = (i === hist.length - 1);

            ? (isLast ? '#ff6b6b' : 'rgba(255,107,107,0.55)')

        trendHtml += '<div style="width:100%;max-width:50px;height:'+barH+'px;background:'+bg+';border-radius:2px 2px 0 0;min-height:3px;"></div>';
        trendHtml += '<div style="font-size:9px;color:var(--text-tertiary);margin-top:3px;white-space:nowrap;">'+sdate(h.date)+'</div>';
        trendHtml += '</div>';
    });
    trendHtml += '</div></div>'; // end left bars

    // --- 右侧：每日 Top3 标签矩阵 ---
    trendHtml += '<div style="width:220px;flex-shrink:0;">';
    trendHtml += '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:8px;font-weight:600;">每日Top3板块</div>';
    trendHtml += '<div style="display:flex;flex-direction:column;gap:3px;">';

    // 表头日期行
    trendHtml += '<div style="display:flex;gap:3px;margin-bottom:3px;">';
    hist.forEach(function(h, i){
        var isLast = (i === hist.length - 1);
        trendHtml += '<div style="flex:1;text-align:center;font-size:9px;color:' + (isLast ? 'var(--text-primary)' : 'var(--text-tertiary)') + (isLast ? ';font-weight:700;' : ';') + '">' + sdate(h.date).slice(-2) + '日</div>';
    });
    trendHtml += '</div>';

    // 3行标签
    for (var row = 0; row < 3; row++) {
        trendHtml += '<div style="display:flex;gap:3px;">';
        hist.forEach(function(h, i){
            var isLast = (i === hist.length - 1);
            var name = (h.top3 && h.top3[row]) || '-';
            var displayName = name.length > 4 ? name.slice(0,4) : name;
            var tagBg, tagClr;
            if (isLast) {
                tagBg = h.is_positive ? '#ff6b6b' : '#26de81';
                tagClr = '#fff';
            } else {
                if (h.is_positive) { tagBg = 'rgba(255,107,107,0.12)'; tagClr = '#e17055'; }
                else { tagBg = 'rgba(38,222,129,0.10)'; tagClr = '#00b894'; }
            }
            var isHot = false;
            hotSectors.forEach(function(hs){ if (hs[0] === name) isHot = true; });
            var bStyle = isHot && !isLast ? 'border:1px solid '+(h.is_positive?'#e17055':'#00b894')+';' : '';
            trendHtml += '<div style="flex:1;text-align:center;font-size:10px;padding:3px 2px;border-radius:4px;background:'+tagBg+';color:'+tagClr+';'+bStyle+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+name+((h.top3_values&&h.top3_values[row])?' · '+h.top3_values[row]+'亿':'')+'">'+displayName+'</div>';
        });
        trendHtml += '</div>';
    }
    trendHtml += '</div>'; // end tag matrix

    // 主线信号
    if (hotSectors.length > 0) {
        trendHtml += '<div style="margin-top:8px;padding:6px 10px;background:rgba(250,237,218,0.5);border-radius:6px;border:1px solid rgba(181,167,39,0.25);">';
        trendHtml += '<span style="font-size:11px;color:#854F0B;font-weight:600;">🔥 主线信号:</span> ';
        hotSectors.forEach(function(hs, i){
            trendHtml += '<span style="font-size:11px;color:#854F0B;font-weight:700;">'+hs[0]+'</span>';
            if (i < hotSectors.length - 1) trendHtml += '<span style="color:#854F0B;font-size:10px;">x'+hs[1]+' </span>';
        });
        trendHtml += '</div>';
    }

    trendHtml += '</div>'; // end right tags
    trendHtml += '</div>'; // end flex container
    trendHtml += '</div>'; // end outer

    bodyEl.querySelector('div').insertAdjacentHTML('afterend', trendHtml);
  }

  section.style.display = '';
}// ── M9: 市场宽度 ──

// ===== Cookie 用户ID管理 =====
function getOrCreateUserId() {
  var match = document.cookie.match(/(?:^|;\s*)etf_user_id=([^;]*)/);
  if (match && match[1]) return match[1];
  // 生成 UUID v4
  var uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
  // 存入 Cookie，有效期 1 年
  var d = new Date(); d.setFullYear(d.getFullYear() + 1);
  document.cookie = 'etf_user_id=' + uuid + '; expires=' + d.toUTCString() + '; path=/; SameSite=Lax';
  return uuid;
}

// ===== 情绪综合研判（规则引擎） =====
function renderJudgment(d) {
  var j = d.judgment;
  if (!j || !j.composite) { return; }

  var section = document.getElementById('judgeSection');
  section.style.display = 'block';

  // 评分圆环颜色
  var circle = document.getElementById('judgeCircle');
  var ringColor;
  if (j.composite >= 6.5) ringColor = 'var(--down)';
  else if (j.composite >= 4.5) ringColor = 'var(--gold)';
  else ringColor = 'var(--up)';
  circle.style.borderColor = ringColor;
  circle.style.boxShadow = '0 0 16px ' + ringColor.replace('var(','').replace(')','');
  document.getElementById('judgeScoreNum').textContent = j.composite;
  document.getElementById('judgeScoreNum').style.color = ringColor;

  // 标签徽章
  var badge = document.getElementById('judgeBadge');
  badge.textContent = j.label;
  badge.className = 'judge-badge ' + (j.category || '');

  // 综合观点
  document.getElementById('judgeVerdict').textContent = j.verdict;

  // 各指标明细
  var details = document.getElementById('judgeDetails');
  var html = '';
  var order = ['m1_kline', 'm4_adr', 'm5_limits', 'm3_capital', 'm2_search', 'm6_voldev'];
  for (var i = 0; i < order.length; i++) {
    var k = order[i];
    var v = j.scores_detail[k];
    if (!v) continue;
    var pct = Math.round(v.score / 10 * 100);
    var barColor;
    if (v.score >= 7) barColor = 'var(--down)';
    else if (v.score >= 5) barColor = 'var(--gold)';
    else barColor = 'var(--up)';
    html += '<div class="judge-item">'
      + '<span class="judge-item-label">' + v.label + '</span>'
      + '<div class="judge-item-bar"><div class="judge-item-bar-fill" style="width:' + pct + '%;background:' + barColor + '"></div></div>'
      + '<span class="judge-item-value">' + v.value + '</span>'
      + '</div>';
  }
  details.innerHTML = html;
}

// ===== AI预测 + 用户反馈 =====
let _predictionData = null;
let _feedbackSelected = null;
let _userId = null;

async function fetchPrediction() {
  try {
    const r = await fetch('/api/sentiment/predict');
    const d = await r.json();
    if (!d.success) {
      var el = document.getElementById('predictBody');
      el.innerHTML = '<div class="predict-loading" style="color:var(--down)">⚠️ AI预测暂时不可用：<span class="err-msg"></span><br><span style="font-size:11px;color:var(--text2)">（可能是LLM API Key未配置，不影响其他功能）</span></div>';
      el.querySelector('.err-msg').textContent = d.error || '未知错误';
      document.getElementById('predictSection').style.display = 'block';
      return;
    }
    _predictionData = d;
    renderPrediction(d);
    // 检查当前用户是否已有反馈
    checkMyFeedback(d.prediction_id);
  } catch(e) {
    var el = document.getElementById('predictBody');
    el.innerHTML = '<div class="predict-loading" style="color:var(--down)">⚠️ 预测接口请求失败<br><span style="font-size:11px;color:var(--text2)"></span></div>';
    el.querySelector('span').textContent = e.message || '';
    document.getElementById('predictSection').style.display = 'block';
  }
}

function checkMyFeedback(predictionId) {
  if (!predictionId) return;
  fetch('/api/sentiment/feedback/check?prediction_id=' + predictionId)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.has_feedback) {
        // 用户已有反馈 → 禁用按钮，显示历史
        _feedbackSelected = d.agree;
        document.getElementById('btnAgree').disabled = true;
        document.getElementById('btnDisagree').disabled = true;
        document.getElementById('fbComment').disabled = true;
        document.getElementById('btnSubmit').disabled = true;
        document.getElementById('btnSubmit').textContent = '已提交';
        document.getElementById('btnAgree').className = 'fb-btn agree' + (d.agree?' selected':'');
        document.getElementById('btnDisagree').className = 'fb-btn disagree' + (d.agree?'':' selected');
        var resultEl = document.getElementById('fbResult');
        resultEl.className = 'fb-result ok';
        resultEl.textContent = '✅ 已提交反馈 · ' + (d.agree ? '你认可此预测' : '你不认可此预测');
      }
      // 加载反馈历史
      loadMyFeedbackHistory();
    });
}

async function loadMyFeedbackHistory() {
  try {
    var r = await fetch('/api/sentiment/feedback/my');
    var d = await r.json();
    var el = document.getElementById('myFeedbackList');
    var sec = document.getElementById('myFeedbackSection');

    // 没有数据 → 隐藏整个区域
    if (!d.success || !d.data || d.data.length === 0) {
      sec.style.display = 'none';
      return;
    }

    // 只取当天的预测
    var todayStr = new Date().toISOString().slice(0,10);
    var todayItems = d.data.filter(function(x) {
        return (x.predicted_date || '').slice(0,10) === todayStr
            || (x.created_at || '').slice(0,10) === todayStr;
    });

    // 当天没有任何预测/反馈 → 隐藏
    if (todayItems.length === 0) {
      sec.style.display = 'none';
      return;
    }

    // 当天有预测但都没反馈 → 也隐藏（等用户提交后再显示）
    var hasAnyFb = todayItems.some(function(x){ return x.has_feedback; });
    if (!hasAnyFb) {
      sec.style.display = 'none';
      return;
    }

    // 当天有反馈 → 展示
    sec.style.display = 'block';
    el.innerHTML = '';

    var dirMap = { bullish: { cls:'bullish', txt:'📈 看涨' }, bearish: { cls:'bearish', txt:'📉 看跌' }, neutral: { cls:'neutral', txt:'📊 震荡' } };

    todayItems.forEach(function(item) {
        if (!item.has_feedback) return;  // 只显示已反馈的

        var dm = dirMap[item.direction] || dirMap.neutral;
        var div = document.createElement('div');
        div.className = 'my-fb-item';

        var html = '';
        html += '<div class="my-fb-item-row">';
        html += '<span class="my-fb-dir ' + dm.cls + '">' + dm.txt + '</span>';
        html += '<span class="my-fb-agree ' + (item.agree ? 'yes' : 'no') + '">' + (item.agree ? '👍 认可' : '👎 不认可') + '</span>';
        html += '</div>';

        var ptext = (item.prediction_text || '(无预测内容)').replace(/\n/g, " ").trim();
        html += '<div class="my-fb-pred" title="点击展开" style="-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;">' + escapeHtml(ptext.substring(0, 300)) + (ptext.length > 300 ? '...' : '') + '</div>';

        if (item.comment && item.comment.trim()) {
            html += '<div class="my-fb-comment">💬 ' + escapeHtml(item.comment.trim()) + '</div>';
        }

        div.innerHTML = html;
        el.appendChild(div);

        // 绑定展开
        div.querySelector('.my-fb-pred').addEventListener('click', function() {
            this.style.webkitLineClamp = (this.style.webkitLineClamp === 'unset') ? '2' : 'unset';
        });
    });

  } catch(e) {
    console.error('loadMyFeedbackHistory error:', e);
    document.getElementById('myFeedbackSection').style.display = 'none';
  }
}


function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function renderPrediction(d) {
  document.getElementById('predictSection').style.display = 'block';
  document.getElementById('predictBody').textContent = d.prediction_text || '（无预测内容）';

  // 元信息
  var meta = '预测日期: <b>' + (d.predicted_date || '-') + '</b> · 模型: ' +
    (d.llm_model || 'LLM') + (d.from_db ? ' · 数据库' : ' · 实时生成');
  document.getElementById('predictMeta').innerHTML = meta;

  // 方向徽章
  var badge = document.getElementById('directionBadge');
  var dirMap = { bullish: { cls: 'bullish', txt: '📈 看涨' },
                 bearish: { cls: 'bearish', txt: '📉 看跌' },
                 neutral: { cls: 'neutral', txt: '📊 震荡' } };
  var dm = dirMap[d.direction] || dirMap.neutral;
  badge.className = 'direction-badge ' + dm.cls;
  badge.textContent = dm.txt;
  badge.style.display = 'inline-flex';

  // 显示反馈区
  document.getElementById('feedbackSection').style.display = 'block';
}

function selectFeedback(agree) {
  _feedbackSelected = agree;
  document.getElementById('btnAgree').className = 'fb-btn agree' + (agree === true ? ' selected' : '');
  document.getElementById('btnDisagree').className = 'fb-btn disagree' + (agree === false ? ' selected' : '');
  document.getElementById('btnSubmit').disabled = false;
}

function submitFeedback() {
  if (_feedbackSelected === null || !_predictionData) return;
  var comment = document.getElementById('fbComment').value.trim();
  var btn = document.getElementById('btnSubmit');
  var resultEl = document.getElementById('fbResult');

  btn.disabled = true;
  btn.textContent = '提交中...';

  fetch('/api/sentiment/feedback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      prediction_id: _predictionData.prediction_id,
      agree: _feedbackSelected,
      comment: comment
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.success) {
      resultEl.className = 'fb-result ok';
      resultEl.textContent = '✅ 反馈已提交，感谢你的参与！';
      // 禁用后续操作
      document.getElementById('btnAgree').disabled = true;
      document.getElementById('btnDisagree').disabled = true;
      document.getElementById('fbComment').disabled = true;
      btn.textContent = '已提交';
      // 刷新反馈历史
      loadMyFeedbackHistory();
    } else if (data.feedback_id) {
      // 409: 重复提交
      resultEl.className = 'fb-result ok';
      resultEl.textContent = '⚠️ ' + (data.error || '您已提交过反馈');
      document.getElementById('btnAgree').disabled = true;
      document.getElementById('btnDisagree').disabled = true;
      document.getElementById('fbComment').disabled = true;
      btn.textContent = '已提交';
    } else {
      resultEl.className = 'fb-result err';
      resultEl.textContent = '❌ 提交失败: ' + (data.error || '未知错误');
      btn.disabled = false;
      btn.textContent = '提交反馈';
    }
  })
  .catch(function(e) {
    resultEl.className = 'fb-result err';
    resultEl.textContent = '❌ 网络错误: ' + e.message;
    btn.disabled = false;
    btn.textContent = '提交反馈';
  });
}

init();
</script>
</body>
</html>
